[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitmoe"
version = "0.1.0"
description = "Controlled experiments for shared/private sparse Mixture-of-Experts language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "transformers>=4.40",
  "datasets>=2.18",
  "wandb>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
splitmoe-prepare = "splitmoe.prepare_data:main"
splitmoe-train = "splitmoe.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

